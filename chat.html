<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Chatroom</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/chat.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chatrooms</h2>
                <button id="createRoomBtn" class="icon-btn" title="Create Room">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            
            <div class="user-info">
                <div class="user-avatar"></div>
                <span id="currentUsername"></span>
                <button id="logoutBtn" class="icon-btn" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            
            <div class="rooms-list" id="roomsList">
                <!-- Rooms will be populated here -->
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3 id="currentRoomName">Select a room</h3>
                    <button id="roomMembersBtn" class="icon-btn" title="Members" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </button>
                    <button id="deleteRoomBtn" class="icon-btn" title="Delete Room" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="no-room-selected">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <p>Select a room to start chatting</p>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
            
            <div class="message-input-container" id="messageInputContainer" style="display: none;">
                <div class="reply-preview" id="replyPreview" style="display: none;">
                    <span id="replyText"></span>
                    <button id="cancelReply" class="icon-btn-small">×</button>
                </div>

                <!-- File Preview Area -->
                <div class="message-file-preview" id="messageFilePreview" style="display: none;">
                    <div class="preview-files" id="previewFiles"></div>
                    <button class="btn-clear-files" onclick="clearMessageFiles()">Clear</button>
                </div>
                
                <div class="message-input-wrapper" id="messageInputWrapper">
                    <label for="chatFileUploadInput" class="file-upload-btn" title="Upload File">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </label>
                    <input type="file" id="chatFileUploadInput" style="display: none;" multiple>
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type a message or drag files here..." 
                        autocomplete="off"
                    >
                    <button id="sendBtn" class="btn-send">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Files Aside -->
       <aside class="files-aside" id="filesAside">
            <div class="files-header">
                <div class="tabs-container">
                    <button id="notesTabBtn" class="tab-btn active" title="Notes">
                        Notes
                    </button>
                    <button id="filesTabBtn" class="tab-btn" title="Files">
                        Files
                    </button>
                </div>
            </div>
            <div class="container" id="noteContainer">
                <div class="writing">
                    <textarea class="note_taker" placeholder="Write your personal notes here..."></textarea>
                </div>

                <div class="user_notes">
                    <h4 class="section-title">Member Notes</h4>

                    <div class="member-note-item current-user-item active">
                        <div class="member-header" onclick="toggleMemberNotes(this)">
                            <span class="member-name">Me (You)</span>
                            <div class="header-actions">
                                <button class="add-note-btn" onclick="saveCurrentNote(event)" title="Save note">+</button>
                                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </div>
                        </div>
                        
                        <div class="member-notes-list" id="myNotesList">
                            <div class="note-entry user-note-entry">
                                <span class="note-text">Yawerz</span>
                                <div class="note-actions">
                                    <button class="action-btn view" onclick="viewNote(this)" title="View">o</button>
                                    <button class="action-btn edit" onclick="editNote(this)" title="Edit">^</button>
                                    <button class="action-btn delete" onclick="deleteNote(this)" title="Delete">x</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="member-note-item">
                        <div class="member-header" onclick="toggleMemberNotes(this)">
                            <span class="member-name">User_Jeongyeon</span>
                            <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="member-notes-list">
                            <div class="note-entry">
                                <span class="note-text">Meeting minutes from Tuesday </span>
                                <div class="note-actions">
                                    <button class="action-btn view" onclick="viewNote(this)" title="View">o</button>
                                    <button class="action-btn edit" onclick="editNote(this)" title="Edit">^</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="member-note-item">
                        <div class="member-header" onclick="toggleMemberNotes(this)">
                            <span class="member-name">Nayeon</span>
                            <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="member-notes-list">
                            <div class="note-entry">
                                <span class="note-text">POP POP POP POP POP POP POP </span>
                                <div class="note-actions">
                                    <button class="action-btn view" onclick="viewNote(this)" title="View">o</button>
                                    <button class="action-btn edit" onclick="editNote(this)" title="Edit">^</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container" id="filesContainer" style="display: none">
                <!-- Files Controls -->
                <div class="files-controls">
                    <div class="files-control-top">
                        <input type="text" id="fileSearchInput" placeholder="Search files..." class="file-search">
                        <select id="fileSortSelect" class="file-sort">
                            <option value="name">Sort by Name</option>
                            <option value="size">Sort by Size</option>
                            <option value="type">Sort by Type</option>
                        </select>
                    </div>
                    <div class="files-control-bottom">
                        <span class="file-count-badge" id="fileCountBadge">0 files</span>
                    </div>
                </div>

                <!-- File Categories -->
                <div class="files-list" id="filesList">
                    <!-- Files grouped by category will be populated here -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Note View Modal -->
    <div id="noteViewModal" class="note-modal" style="display: none;">
        <div class="note-modal-content">
            <div class="note-modal-header">
                <h4>Note Details</h4>
                <button class="icon-btn-small" onclick="closeNoteModal()" title="Close">×</button>
            </div>
            <div class="note-modal-body" id="noteModalText"></div>
        </div>
    </div>
    
    <!-- Create Room Modal -->
    <div id="createRoomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Room</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="roomName">Room Name</label>
                    <input type="text" id="roomName" placeholder="Enter room name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('createRoomModal')">Cancel</button>
                <button class="btn-primary" id="confirmCreateRoom">Create</button>
            </div>
        </div>
    </div>
    
    <!-- Invite Members Modal -->
    <div id="inviteMembersModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Room Members</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="membersList" class="members-list"></div>
                <div class="input-group" style="margin-top: 20px;">
                    <label for="inviteUsername">Invite User</label>
                    <input type="text" id="inviteUsername" placeholder="Enter username">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('inviteMembersModal')">Close</button>
                <button class="btn-primary" id="confirmInvite">Invite</button>
            </div>
        </div>
    </div>
    
    <!-- Emoji Picker -->
    <div id="emojiPicker" class="emoji-picker" style="display: none;">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/aside.js"></script>
</body>
</html>
