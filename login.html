<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chatroom</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-box">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <span>Chatroom</span>
            </div>
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to pick up where you left off.</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div id="errorMessage" class="form-error" role="alert" hidden></div>

                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
