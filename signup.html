<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Chatroom</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-box">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">&gt;_</span>
                <span>Chatroom</span>
            </div>
            <h1>Create an account</h1>
            <p class="subtitle">Sign up to start chatting with your team.</p>

            <form id="signupForm" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" type="text" id="username" name="username" required autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}">
                    <p class="hint">3-32 characters: letters, digits, _ . -</p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" required autocomplete="new-password" minlength="8" maxlength="72">
                    <p class="hint">8-72 characters</p>
                </div>

                <div id="errorMessage" class="form-error" role="alert" hidden></div>

                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
